        # Prefix: Backtick (`) - primary, Ctrl-Space and Ctrl-b - secondary
        set -g prefix `
        set -g prefix2 C-Space
        set -ga prefix2 C-b
        bind ` send-prefix
        bind C-Space send-prefix
        bind C-b send-prefix

        # Better defaults
        # Advertise tmux-256color and truecolor capabilities (tmux ≥ 3.3)
        set -g default-terminal "tmux-256color"
        set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB,alacritty:RGB,xterm-kitty:RGB,foot:RGB"
        # Hint apps to use truecolor inside tmux
        set-environment -g COLORTERM truecolor
        set -g mouse on
        set -g history-limit 50000
        # Start windows and panes at 1, not 0
        set -g base-index 1
        set -g pane-base-index 1
        set-hook -g session-created "if-shell \"[ '#{session_name}' = '0' ]\" \"rename-session 1\""
        set-option -g renumber-windows on
        # Keep manual window names; ignore program renames
        set -g automatic-rename off
        set -g allow-rename off
        set -g set-titles on
        # Show window name in terminal/tab title
        set -g set-titles-string "#W"

        # Remove delays
        set -s escape-time 0
        set -g repeat-time 600
        set -g focus-events on

        # Vi mode
        set-window-option -g mode-keys vi
        # Integrate copy with system clipboard; prefer wl-copy, fallback to xclip
        set -s set-clipboard on
        bind-key -T copy-mode-vi 'v' send -X begin-selection
        bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'wl-copy || xclip -selection clipboard -in'
        bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

        # Keyboard shortcuts (vim-style)
        bind h select-pane -L
        bind j select-pane -D
        bind k select-pane -U
        bind l select-pane -R
        # Also allow Ctrl-h/j/k/l without prefix to move between panes
        bind -n C-h select-pane -L
        bind -n C-j select-pane -D
        bind -n C-k select-pane -U
        bind -n C-l select-pane -R

        # Window splitting (defaults + easier alternatives)
        # Defaults (widely documented)
        bind '"' split-window -v -c "#{pane_current_path}"
        bind % split-window -h -c "#{pane_current_path}"
        # Easier, shift-less alternatives
        bind - split-window -v -c "#{pane_current_path}"
        bind \\ split-window -h -c "#{pane_current_path}"
        # Keep existing as optional
        bind | split-window -h -c "#{pane_current_path}"

        # Show pane headers with index, command, and path
        set -g pane-border-status top
        set -g pane-border-format "#{pane_index} #{pane_current_command} #{pane_current_path}"

        # Pane resizing
        bind -r H resize-pane -L 5
        bind -r J resize-pane -D 5
        bind -r K resize-pane -U 5
        bind -r L resize-pane -R 5

        # Window navigation
        bind -r C-h select-window -t :-
        bind -r C-l select-window -t :+
        # Alt/Cmd + number to switch windows (like browser tabs)
        bind -n M-1 select-window -t 1
        bind -n M-2 select-window -t 2
        bind -n M-3 select-window -t 3
        bind -n M-4 select-window -t 4
        bind -n M-5 select-window -t 5
        bind -n M-6 select-window -t 6
        bind -n M-7 select-window -t 7
        bind -n M-8 select-window -t 8
        bind -n M-9 select-window -t 9
        bind -n M-0 select-window -t 10
        bind -n M-w choose-tree -Zw

        # Session management
        bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
        bind x kill-pane
        bind X kill-window
        bind c new-window -c "#{pane_current_path}"

        # Quick access to common commands
        bind g new-window -n "git" -c "#{pane_current_path}" "git status"
        bind t new-window -n "htop" "btop"
        bind y new-window -n "yazi" -c "#{pane_current_path}" "yazi"

        # URLs: pick from scrollback with fzf and open via xdg-open
        bind u run-shell -b "~/.local/bin/fzf-tmux-url"

        # FZF tmux switcher bindings
        bind f run-shell -b "~/.local/bin/tmux-fzf-switch all"
        bind S run-shell -b "~/.local/bin/tmux-fzf-switch sessions"
        bind W run-shell -b "~/.local/bin/tmux-fzf-switch windows"
        bind P run-shell -b "~/.local/bin/tmux-fzf-switch panes"

        # Kubernetes context indicator appended to status-right
        set -ga status-right " #(~/.local/bin/tmux-kube)"

        # Theme: Catppuccin (latte)
        set -g status-position top
        set -g status-interval 5
        set -g @catppuccin_flavour 'latte'
        # Base styles (harmonize with Catppuccin)
        set -g status-style "bg=#eff1f5,fg=#4c4f69"
        set -g message-style "bg=#eff1f5,fg=#4c4f69"
        set -g message-command-style "bg=#bcc0cc,fg=#4c4f69,bold"
        set -g mode-style "bg=#ccd0da,fg=#4c4f69"
        set -g menu-style "fg=#4c4f69,bg=#ccd0da"
        set -g menu-selected-style "fg=#eff1f5,bg=#1e66f5,bold"
        set -g menu-border-style "fg=#bcc0cc"
        set -g menu-border-lines double
        set -g pane-border-lines double
        set -g pane-border-style "fg=#7c7f93"
        set -g pane-active-border-style "fg=#1e66f5,bold"
        set -g pane-border-format "#[fg=#9ca0b0] #{pane_index} #[fg=#7c7f93]#{pane_current_command}#[fg=#9ca0b0] · #{=-20:pane_current_path} "
        set -g display-panes-active-colour "#1e66f5"
        set -g display-panes-colour "#8c8fa1"
        set -g clock-mode-colour "#1e66f5"

        # Windows appearance
        set -g window-status-separator ""
        set -g window-status-format " #I #[fg=#6c6f85]#W#{?window_flags, #[fg=#fe640b]#F,} #{?window_zoomed_flag,#[fg=#df8e1d]Z ,}"
        set -g window-status-current-format " #[reverse]#I #[noreverse,bold]#W #{?window_zoomed_flag,#[fg=#df8e1d]🔍 ,}"
        set -g window-status-activity-style "fg=#fe640b,bg=#eff1f5"
        set -g window-status-bell-style "fg=#d20f39,bg=#eff1f5,bold"

        # Status content
        set -g status-left-length 24
        set -g status-right-length 90
        # Left: session only (window lives in window list)
        set -g status-left " #{?#{==:#S,personal},#[fg=#8839ef,bold],#{?#{==:#S,work},#[fg=#40a02b,bold],#[fg=#1e66f5,bold]}}#S #[fg=#9ca0b0]• "
        # Right: git • time • cpu • battery
        set -g status-right "#{?client_prefix,#[fg=#eff1f5,bg=#fe640b,bold] PREFIX #[fg=#fe640b,bg=#eff1f5],}#{?#{==:#{pane_mode},copy-mode},#[fg=#eff1f5,bg=#ea76cb,bold] COPY #[fg=#ea76cb,bg=#eff1f5],} #(~/.local/bin/tmux-git) #[fg=#9ca0b0]| #[fg=#4c4f69]%Y-%m-%d %H:%M #[fg=#179299]#{cpu_icon}#{cpu_percentage} #[fg=#40a02b]#{battery_icon}#{battery_percentage}"

        # Prefix indicator (tmux-prefix-highlight) — appended last to avoid truncation
        set -ga status-right " #{prefix_highlight}"
        set -g @prefix_highlight_fg "#eff1f5"
        set -g @prefix_highlight_bg "#fe640b"
        set -g @prefix_highlight_show_copy_mode "on"
        set -g @prefix_highlight_copy_mode_attr "fg=#eff1f5,bg=#ea76cb,bold"
        set -g @prefix_highlight_show_sync_mode "on"
        set -g @prefix_highlight_sync_mode_attr "fg=#eff1f5,bg=#d20f39,bold"

        # Session restore
        set -g @continuum-restore 'on'
        set -g @continuum-save-interval '15'

        # Show neofetch on session creation
        set-hook -g session-created 'run-shell "${pkgs.neofetch}/bin/neofetch"'

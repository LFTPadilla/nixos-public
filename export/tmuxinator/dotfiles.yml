# /Users/felipe/.dotfiles/export/tmuxinator/dotfiles.yml
<% @args ||= [] %>

name: dotfiles
root: ~/.dotfiles

# Attach to existing session instead of creating new windows
attach: true

windows:
  - git: lazygit

  - ai:
      layout: even-horizontal
      panes:
        - zsh 
        - claude --continue

  - editor:
      layout: even-horizontal
      panes:
        - yazi
        - zsh

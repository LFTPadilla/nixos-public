name: CI

on:
  push:
    branches: [main, master, hyperland]
  pull_request:
    branches: [main, master, hyperland]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # hardware-configuration.nix files are generated by nixos-generate-config
      # and are not ours to reformat.
      - name: Check formatting
        run: |
          nix run nixpkgs#alejandra -- --check \
            $(find . -name '*.nix' -not -path './.git/*' \
                -not -name 'hardware-configuration.nix')

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject private-only paths
        run: |
          if git ls-files | grep -Ef .public-export-denylist; then
            echo "Private-only paths are tracked in the public repository." >&2
            exit 1
          fi

      # Syncing from the private repository copies modules verbatim, so a module
      # can arrive importing a path the denylist strips. Catch that here rather
      # than through a confusing eval failure.
      - name: Reject imports of private-only paths
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          deny = [re.compile(l) for l in
                  pathlib.Path('.public-export-denylist').read_text().split() if l]
          root = pathlib.Path('.').resolve()
          bad = set()
          for f in pathlib.Path('.').rglob('*.nix'):
              if '.git' in f.parts:
                  continue
              for m in re.finditer(r'(?<![\w/."])(\.\.?/[\w./-]+\.nix)', f.read_text()):
                  t = (f.parent / m.group(1)).resolve()
                  try:
                      rel = t.relative_to(root).as_posix()
                  except ValueError:
                      continue
                  # private-hosts.nix is stubbed later in this job.
                  if rel == 'system/private-hosts.nix':
                      continue
                  if not t.exists() or any(r.search(rel) for r in deny):
                      bad.add(f'{f}: imports {rel}')
          if bad:
              print('\n'.join(sorted(bad)), file=sys.stderr)
              sys.exit(1)
          EOF

      # Catches duplicate attributes and syntax errors in every module, including
      # ones that no evaluated flake output happens to import.
      - name: Parse every Nix file
        run: |
          status=0
          while read -r f; do
            nix-instantiate --parse "$f" >/dev/null || status=1
          done < <(find . -name '*.nix' -not -path './.git/*')
          exit $status

      # Discovery is by shebang, not extension: most scripts in system/scripts
      # (tmux-save, mux-session, rebuild, ...) have no .sh suffix.
      - name: Shell syntax and lint
        run: |
          grep -rlIE '^#!.*/(env +)?(ba)?sh|^# shellcheck shell=' \
            system/scripts > /tmp/shfiles
          echo "linting $(wc -l < /tmp/shfiles) shell files"
          status=0
          while read -r f; do bash -n "$f" || status=1; done < /tmp/shfiles
          while read -r f; do
            nix run nixpkgs#shellcheck -- -S error "$f" || status=1
          done < /tmp/shfiles
          exit $status

      - name: Validate tmuxinator projects
        run: |
          nix shell nixpkgs#yq-go -c bash -c '
            status=0
            for f in export/tmuxinator/*.yml; do
              name=$(yq -r ".name" "$f")
              start=$(yq -r ".startup_window // \"\"" "$f")
              if [ "$name" != "$(basename "$f" .yml)" ]; then
                echo "$f: name \"$name\" does not match filename"; status=1
              fi
              if [ -n "$start" ] && ! yq -e ".windows[] | select(has(\"$start\"))" "$f" >/dev/null 2>&1; then
                echo "$f: startup_window \"$start\" is not a defined window"; status=1
              fi
            done
            exit $status'

      # private-hosts.nix holds private host mappings and is not published, so the
      # hosts importing it need the example substituted in order to evaluate.
      # git add is required: a flake only sees files git knows about, and this
      # file is untracked here by design.
      - name: Stub private hosts
        run: |
          cp system/example.private-hosts.nix system/private-hosts.nix
          git add -f --intent-to-add system/private-hosts.nix

      - name: Evaluate flake targets
        run: |
          status=0
          nix eval --raw ".#homeConfigurations.ubuntu-dev.config.home.username" || status=1
          nix eval --raw \
            ".#darwinConfigurations.mac.config.home-manager.users.felipe.home.username" || status=1
          for t in default-msi default-hp nixos-aws nixos-installer; do
            nix eval --raw ".#nixosConfigurations.$t.config.system.build.toplevel.drvPath" || status=1
          done
          exit $status

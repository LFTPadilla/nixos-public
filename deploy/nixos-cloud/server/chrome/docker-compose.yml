---
services:
  chrome:
    image: lscr.io/linuxserver/chrome:latest
    container_name: chrome
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # - CHROME_CLI=https://www.linuxserver.io/ #optional
    volumes:
      - /home/felipe/server/chrome:/config
#    network_mode: host
    ports:
      - 3000:3000
      - 3001:3001
    dns: [100.100.100.100, 8.8.8.8]
    shm_size: "1gb"
    restart: unless-stopped
